name: Sync photos from pCloud
on:
  schedule:
    - cron: '*/5 * * * *'  # safety net only: the site triggers this workflow right after each upload
  workflow_dispatch:

concurrency:
  group: photo-sync
  cancel-in-progress: false   # one run at a time; a second request waits and picks up everything new

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sync/requirements.txt
      - run: command -v ffmpeg >/dev/null || timeout 180 bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg' || echo "ffmpeg install failed, continuing"
      - run: pip install -q -r sync/requirements.txt
      - run: python sync/sync_photos.py
        env:
          PHOTOS_PASSWORD: ${{ secrets.PHOTOS_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: daily picture-of-the-day caption
          PHOTOS_UPLOAD_CODE: ${{ secrets.PHOTOS_UPLOAD_CODE }}   # code of the pCloud upload link into the same folder
      - name: Commit changes
        run: |
          git config user.name "photo-sync"
          git config user.email "actions@github.com"
          git add photos/
          if ! git diff --cached --quiet; then
            git commit -m "Sync photos from pCloud"
            git pull --rebase -q origin main || true
            git push
            # workflow-made pushes don't trigger other workflows — dispatch the deploy explicitly
            curl -s -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
              -d '{"ref":"main"}'
          fi
