<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — Gudmundur & Grace</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon-32.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#F5F0E6; color:#3E3A33; font-family:'Newsreader', Georgia, serif;
         text-align:center; padding:2rem; }
  .amp { font-family:'Fraunces', serif; font-style:italic; color:#C09A3E; font-size:3rem; }
  h1 { font-family:'Fraunces', serif; font-weight:400; font-size:1.6rem; margin:.6rem 0 .4rem; }
  p { color:#5C564C; margin:0 0 1.4rem; }
  a { color:#8A6E20; }
</style>
</head>
<body>
<main>
  <div class="amp">&</div>
  <h1>This page isn't part of the story</h1>
  <p>— but the rest is still being written.</p>
  <a href="/">Back to the beginning</a>
</main>
<script>
// visitor logging (silent) — recorded even if geo lookup is blocked. No exclusions.
(function(){
  var SB='https://mjphpctvuxmbjhmcscoj.supabase.co/rest/v1/visitor_logs';
  var K='sb_publishable_MDPfXyMjG0eadmvp7uoqdg_EHwj4Alm';
  var TAG='domains:404';
  function grab(u,map){
    return fetch(u,{cache:'no-store'}).then(function(r){
      if(!r.ok) throw 0; return r.json();
    }).then(function(d){ var o=map(d); if(!o.ip) throw 0; return o; });
  }
  function m1(d){ return {ip:d.ip,country:d.country_name,country_code:d.country_code,
    region:d.region,city:d.city,postal:d.postal,timezone:d.timezone,org:d.org,
    latitude:d.latitude,longitude:d.longitude}; }
  function m2(d){ return {ip:d.ip,country:d.country,country_code:d.country_code,
    region:d.region,city:d.city,postal:d.postal,
    timezone:(d.timezone&&d.timezone.id)||null,
    org:(d.connection&&(d.connection.isp||d.connection.org))||null,
    latitude:d.latitude,longitude:d.longitude}; }
  var geo = grab('https://ipapi.co/json/',m1)
    .catch(function(){ return grab('https://ipwho.is/',m2); })
    .catch(function(){ return null; });
  var cap = new Promise(function(res){ setTimeout(function(){ res(null); },3000); });
  Promise.race([geo,cap]).then(function(g){
    var body = g || {org:'(geo unavailable)'};
    body.page = TAG;
    fetch(SB,{method:'POST',headers:{'apikey':K,'Authorization':'Bearer '+K,
      'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(body)}).catch(function(){});
  }).catch(function(){});
})();
</script>
</body>
</html>
