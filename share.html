<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>A photograph</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
  :root { --paper: #F5F0E6; --ink: #2A2520; --muted: #938A79; --accent: #4E6E8E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #0E1118; color: var(--paper); font-family: 'IBM Plex Mono', ui-monospace, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 1rem; }
  img, video { max-width: 96vw; max-height: 82vh; display: block; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .bar { display: flex; gap: 1rem; align-items: center; font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(245,240,230,.6); }
  a, button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: #E9CFA0; background: none; border: 1px solid #E9CFA0; padding: 0.55rem 0.9rem; cursor: pointer; text-decoration: none; }
  a:hover, button:hover { background: #E9CFA0; color: #0E1118; }
  .msg { max-width: 28rem; text-align: center; line-height: 1.7; font-size: 0.75rem; letter-spacing: 0.06em; color: rgba(245,240,230,.75); }
</style>
</head>
<body>
<div class="msg" id="msg">opening…</div>
<script>
/* One shared photo or video from domains.azurenexus.com. The link is share.html#<id>.<key>: the key never leaves this
   browser (it is after the #), the file photos/shared/<id>.enc is the one photo encrypted with that key alone. */
window.addEventListener('hashchange', () => location.reload());
(async function(){
  const msg = document.getElementById('msg');
  const [sid, k] = location.hash.slice(1).split('.');
  const say = t => { msg.textContent = t; msg.hidden = false; };
  if (!/^[A-Za-z0-9_-]{8,40}$/.test(sid || '') || !k) return say('This link is not complete. Ask for it again.');
  try{
    const r = await fetch('photos/shared/' + sid + '.enc', {cache: 'no-cache'});
    if (r.status === 404) return say('This link is not ready yet (it starts working a few minutes after it was made) or it has been stopped.');
    if (!r.ok) throw new Error(r.status);
    const raw = new Uint8Array(await r.arrayBuffer());
    const kb = Uint8Array.from(atob(k.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((k.length + 3) % 4)), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', kb, 'AES-GCM', false, ['decrypt']);
    const body = new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv: raw.slice(0, 12)}, key, raw.slice(12)));
    const isV = body[0] === 118;               // "v"
    const url = URL.createObjectURL(new Blob([body.slice(1)], {type: isV ? 'video/mp4' : 'image/jpeg'}));
    const el = document.createElement(isV ? 'video' : 'img');
    if (isV){ el.controls = true; el.playsInline = true; el.autoplay = true; } else el.alt = 'Shared photograph';
    el.src = url;
    msg.hidden = true;
    document.body.insertBefore(el, msg);
    const bar = document.createElement('div'); bar.className = 'bar';
    const a = document.createElement('a'); a.href = url; a.download = isV ? 'video.mp4' : 'photo.jpg'; a.textContent = 'Download';
    bar.append('shared privately', a);
    document.body.appendChild(bar);
  }catch(e){ say('This link could not be opened. Check it is complete, or ask for a new one.'); }
})();
</script>
</body>
</html>
